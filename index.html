<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>駅オタク — 都道府県当てクイズ</title>
<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:      #0d1b2e;
  --surface: #162032;
  --card:    #1e3a5f;
  --blue:    #3b82f6;
  --blue2:   #1d4ed8;
  --white:   #f1f5f9;
  --gray:    #94a3b8;
  --gray2:   #475569;
  --green:   #22c55e;
  --green-bg:#14532d;
  --red:     #ef4444;
  --red-bg:  #450a0a;
  --yellow:  #eab308;
  --font:    'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;
}
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--white);
  min-height: 100dvh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
}
#app {
  width: 100%;
  max-width: 480px;
  min-height: 100dvh;
  padding: 0 0 40px;
  position: relative;
}
.accent-bar {
  height: 5px;
  background: var(--blue);
  border-radius: 0 0 3px 3px;
}

/* ── SCREENS ── */
.screen { display: none; padding: 24px 20px; }
.screen.active { display: block; }

/* ── TITLE ── */
.title-wrap {
  text-align: center;
  padding-top: 60px;
}
.logo-mark {
  font-size: 64px;
  margin-bottom: 4px;
  line-height: 1;
}
.logo-title {
  font-size: 36px;
  font-weight: 700;
  letter-spacing: 6px;
  color: var(--white);
}
.logo-sub {
  font-size: 13px;
  color: var(--gray);
  letter-spacing: 2px;
  margin-top: 6px;
}
.best-badge {
  display: inline-block;
  background: var(--card);
  border: 1px solid var(--blue);
  border-radius: 20px;
  padding: 6px 20px;
  font-size: 13px;
  color: var(--gray);
  margin-top: 28px;
}
.best-badge span { color: var(--blue); font-weight: 700; font-size: 18px; }
.rule-box {
  background: var(--surface);
  border-radius: 12px;
  padding: 16px 20px;
  margin: 28px 0;
  text-align: left;
}
.rule-item {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  color: var(--gray);
  padding: 4px 0;
}
.rule-icon { font-size: 18px; }
.btn-start {
  width: 100%;
  padding: 18px;
  background: var(--blue);
  color: #fff;
  font-size: 20px;
  font-weight: 700;
  border: none;
  border-radius: 14px;
  cursor: pointer;
  letter-spacing: 3px;
  transition: background .15s;
}
.btn-start:hover { background: var(--blue2); }
.btn-ranking-link {
  display: block;
  text-align: center;
  color: var(--gray);
  font-size: 13px;
  margin-top: 16px;
  cursor: pointer;
  text-decoration: underline;
}

/* ── QUIZ ── */
.quiz-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 12px;
}
.score-label {
  font-size: 13px;
  color: var(--gray);
}
.score-num {
  font-size: 22px;
  font-weight: 700;
  color: var(--white);
}
.miss-icons {
  display: flex;
  gap: 8px;
}
.miss-dot {
  width: 22px; height: 22px;
  border-radius: 50%;
  background: var(--gray2);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  transition: background .2s;
}
.miss-dot.used { background: var(--red); }
.timer-wrap {
  position: relative;
  height: 8px;
  background: var(--gray2);
  border-radius: 4px;
  margin-bottom: 36px;
  overflow: hidden;
}
.timer-bar {
  position: absolute;
  left: 0; top: 0; height: 100%;
  border-radius: 4px;
  transition: width .1s linear, background .3s;
  background: var(--blue);
}
.station-card {
  text-align: center;
  padding: 32px 16px 28px;
  background: var(--surface);
  border-radius: 16px;
  margin-bottom: 24px;
}
.station-label {
  font-size: 12px;
  color: var(--gray);
  letter-spacing: 2px;
  margin-bottom: 12px;
}
.station-name {
  font-size: 52px;
  font-weight: 700;
  line-height: 1.2;
  word-break: break-all;
  overflow-wrap: break-word;
}
.choices {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.choice-btn {
  width: 100%;
  padding: 18px 12px;
  background: var(--card);
  color: var(--white);
  border: 2px solid var(--blue);
  border-radius: 12px;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  transition: background .1s, border-color .1s, color .1s, transform .08s;
  font-family: var(--font);
}
.choice-btn:hover:not(:disabled) {
  background: #254870;
  transform: translateY(-1px);
}
.choice-btn.correct {
  background: var(--green-bg);
  border-color: var(--green);
  color: var(--green);
}
.choice-btn.wrong {
  background: var(--red-bg);
  border-color: var(--red);
  color: var(--red);
}
.choice-btn:disabled {
  opacity: .45;
  cursor: default;
  border-color: var(--gray2);
}
.feedback-banner {
  margin-top: 16px;
  padding: 12px 16px;
  border-radius: 10px;
  text-align: center;
  font-size: 16px;
  font-weight: 700;
  opacity: 0;
  transition: opacity .2s;
}
.feedback-banner.show { opacity: 1; }
.feedback-banner.ok  { background: var(--green-bg); border: 1.5px solid var(--green); color: var(--green); }
.feedback-banner.ng  { background: var(--red-bg);   border: 1.5px solid var(--red);   color: var(--red); }

/* ── RESULT ── */
.result-header {
  text-align: center;
  padding: 36px 0 20px;
}
.result-label {
  font-size: 13px;
  letter-spacing: 3px;
  color: var(--blue);
  margin-bottom: 8px;
}
.result-score {
  font-size: 96px;
  font-weight: 700;
  line-height: 1;
}
.result-unit {
  font-size: 22px;
  color: var(--gray);
  margin-top: 4px;
}
.result-best {
  display: inline-block;
  background: var(--card);
  border: 1px solid var(--blue);
  border-radius: 20px;
  padding: 5px 16px;
  font-size: 13px;
  color: var(--gray);
  margin-top: 12px;
}
.result-best.new { border-color: var(--yellow); color: var(--yellow); }
.divider {
  height: 1px;
  background: var(--card);
  margin: 20px 0;
}
/* ── NICKNAME ── */
.nickname-area {
  margin-bottom: 16px;
}
.nickname-area label {
  font-size: 13px;
  color: var(--gray);
  display: block;
  margin-bottom: 6px;
}
.nickname-area input {
  width: 100%;
  padding: 12px 14px;
  background: var(--surface);
  border: 1.5px solid var(--card);
  border-radius: 10px;
  color: var(--white);
  font-size: 16px;
  font-family: var(--font);
  outline: none;
  transition: border-color .15s;
}
.nickname-area input:focus { border-color: var(--blue); }
.btn-submit-rank {
  width: 100%;
  padding: 14px;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  margin-bottom: 10px;
  font-family: var(--font);
  transition: background .15s;
}
.btn-submit-rank:hover { background: var(--blue2); }
.btn-submit-rank:disabled { opacity: .5; cursor: default; }
.rank-submitted {
  text-align: center;
  font-size: 14px;
  color: var(--green);
  padding: 10px;
  display: none;
}

/* ── SNS SHARE ── */
.btn-share {
  width: 100%;
  padding: 16px;
  background: #000;
  color: #fff;
  border: 1.5px solid #333;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-family: var(--font);
  margin-bottom: 10px;
}
.x-logo {
  font-size: 18px;
  font-weight: 900;
}
.btn-retry {
  width: 100%;
  padding: 16px;
  background: transparent;
  color: var(--blue);
  border: 2px solid var(--blue);
  border-radius: 12px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  font-family: var(--font);
  margin-bottom: 10px;
  transition: background .15s;
}
.btn-retry:hover { background: var(--card); }

/* ── RANKING ── */
.rank-screen-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}
.btn-back {
  background: none;
  border: none;
  color: var(--gray);
  font-size: 22px;
  cursor: pointer;
  padding: 4px;
}
.rank-title {
  font-size: 20px;
  font-weight: 700;
}
.rank-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.rank-item {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--surface);
  border-radius: 10px;
  padding: 12px 16px;
}
.rank-pos {
  font-size: 16px;
  font-weight: 700;
  width: 28px;
  text-align: center;
  color: var(--gray);
}
.rank-pos.gold   { color: #fbbf24; }
.rank-pos.silver { color: #94a3b8; }
.rank-pos.bronze { color: #b45309; }
.rank-name { flex: 1; font-size: 16px; }
.rank-score {
  font-size: 20px;
  font-weight: 700;
  color: var(--blue);
}
.rank-score-unit { font-size: 12px; color: var(--gray); }
.rank-loading { text-align: center; color: var(--gray); padding: 40px; }
.firebase-note {
  background: var(--surface);
  border: 1.5px dashed var(--gray2);
  border-radius: 10px;
  padding: 14px 16px;
  font-size: 13px;
  color: var(--gray);
  margin-bottom: 20px;
  line-height: 1.7;
}
.firebase-note a { color: var(--blue); }
</style>
</head>

  <div class="nickname-area" id="nickname-area">

  </div>
  <button class="btn-submit-rank" id="btn-submit-rank" onclick="submitRanking()">🏆 ランキングに投稿</button>
  <div class="rank-submitted" id="rank-submitted">✓ ランキングに投稿しました！</div>

  <div class="divider"></div>
  <button class="btn-share" onclick="shareX()">

  </button>
  <button class="btn-retry" onclick="startGame()">もう一度プレイ</button>
  <button class="btn-retry" onclick="showTitle()" style="color:var(--gray);border-color:var(--gray2)">タイトルへ</button>
</div>

<!-- ── RANKING SCREEN ── -->
<div class="screen" id="screen-ranking">
  <div class="rank-screen-header">
    <button class="btn-back" onclick="showTitle()">←</button>
    <div class="rank-title">🏆 全国ランキング</div>
  </div>
  <div class="rank-list" id="rank-list">
    <div class="rank-loading">読み込み中...</div>
  </div>
</div>

</div><!-- #app -->

  return shuffle([correct, ...candidates]);
}

/* ══════════════ SCREENS ══════════════ */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}
function showTitle() {
  clearTimer();
  updateBestDisp();
  showScreen('title');
}
function showRanking() {
  showScreen('ranking');
  loadRanking();
}

/* ══════════════ BEST SCORE ══════════════ */
function getBest() { return parseInt(localStorage.getItem('ekiotaku_best') || '0'); }
function setBest(v) { localStorage.setItem('ekiotaku_best', v); }
function updateBestDisp() {
  const b = getBest();
  document.getElementById('best-disp').textContent = b || '—';
}

/* ══════════════ GAME ══════════════ */
function startGame() {
  score = 0; miss = 0; usedIds = new Set();
  document.getElementById('miss0').classList.remove('used');
  document.getElementById('miss1').classList.remove('used');
  showScreen('quiz');
  nextQuestion();
}

function nextQuestion() {
  clearTimer();
  const feedback = document.getElementById('feedback');
  feedback.className = 'feedback-banner';
  feedback.textContent = '';

  // 都道府県ごとに均等になるようにシャッフル後抽出
  const available = STATIONS.filter((_, i) => !usedIds.has(i));
  if (available.length === 0) { usedIds.clear(); }
  const pool = STATIONS.map((s, i) => ({...s, i})).filter(s => !usedIds.has(s.i));
  const pick = pool[Math.floor(Math.random() * pool.length)];
  usedIds.add(pick.i);

  currentAnswer = pick.p;
  const nameEl = document.getElementById('station-name');
  nameEl.textContent = pick.s;
  const len = pick.s.length;
  nameEl.style.fontSize = len <= 4 ? '52px' : len <= 6 ? '44px' : len <= 8 ? '36px' : '28px';
  document.getElementById('score-disp').textContent = score;

  const choices = pickChoices(pick.p);
  const container = document.getElementById('choices');
  container.innerHTML = '';
  choices.forEach(pref => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.textContent = pref;
    btn.onclick = () => answer(pref, btn);
    container.appendChild(btn);
  });

  startTimer();
}

function startTimer() {
  timeLeft = 50; // 50 ticks = 5秒
  updateTimerBar();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerBar();
    if (timeLeft <= 0) {
      clearTimer();
      onTimeout();
    }
  }, 100);
}
function clearTimer() { clearInterval(timerInterval); timerInterval = null; }
function updateTimerBar() {
  const bar = document.getElementById('timer-bar');
  const ratio = timeLeft / 50;
  bar.style.width = (ratio * 100) + '%';
  bar.style.background = ratio > 0.5 ? 'var(--blue)' : ratio > 0.25 ? 'var(--yellow)' : 'var(--red)';
}

function disableChoices() {
  document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
}

function answer(pref, btn) {
  clearTimer();
  disableChoices();
  const feedback = document.getElementById('feedback');
  if (pref === currentAnswer) {
    score++;
    btn.classList.add('correct');
    feedback.textContent = '✓ 正解！';
    feedback.className = 'feedback-banner ok show';
    setTimeout(nextQuestion, 900);
  } else {
    btn.classList.add('wrong');
    // 正解を緑表示
    document.querySelectorAll('.choice-btn').forEach(b => {
      if (b.textContent === currentAnswer) b.classList.add('correct');
    });
    feedback.textContent = '✗ 不正解 … 正解は ' + currentAnswer;
    feedback.className = 'feedback-banner ng show';
    onMiss();
  }
}

function onTimeout() {
  disableChoices();
  document.querySelectorAll('.choice-btn').forEach(b => {
    if (b.textContent === currentAnswer) b.classList.add('correct');
  });
  const feedback = document.getElementById('feedback');
  feedback.textContent = '⏱ 時間切れ！正解は ' + currentAnswer;
  feedback.className = 'feedback-banner ng show';
  onMiss();
}

function onMiss() {
  document.getElementById('miss' + miss).classList.add('used');
  miss++;
  if (miss >= 2) {
    setTimeout(showResult, 1200);
  } else {
    setTimeout(nextQuestion, 1400);
  }
}

/* ══════════════ RESULT ══════════════ */
function showResult() {
  clearTimer();
  document.getElementById('result-score').textContent = score;
  const best = getBest();
  const isNew = score > best;
  if (isNew) setBest(score);
  const bestEl = document.getElementById('result-best');
  bestEl.textContent = isNew ? '🎉 自己ベスト更新！' : '自己ベスト ' + Math.max(score, best) + '問';
  bestEl.className = 'result-best' + (isNew ? ' new' : '');
  // firebase未設定時の注記
  document.getElementById('firebase-note').style.display = fbReady ? 'none' : 'block';
  document.getElementById('nickname-area').style.display = fbReady ? 'block' : 'none';
  document.getElementById('btn-submit-rank').style.display = fbReady ? 'block' : 'none';
  document.getElementById('rank-submitted').style.display = 'none';
  document.getElementById('btn-submit-rank').disabled = false;
  showScreen('result');
}

/* ══════════════ RANKING ══════════════ */
function submitRanking() {
  if (!fbReady) return;
  const name = document.getElementById('nickname-input').value.trim();
  if (!name) {
    const input = document.getElementById('nickname-input');
    input.style.borderColor = 'var(--red)';
    input.placeholder = 'ニックネームを入力してください';
    input.focus();
    setTimeout(() => { input.style.borderColor = ''; }, 2000);
    return;
  }
  const btn = document.getElementById('btn-submit-rank');
  btn.disabled = true;
  db.ref('rankings').push({
    name: name,
    score: score,
    ts: Date.now()
  }).then(() => {
    document.getElementById('rank-submitted').style.display = 'block';
  }).catch(e => {
    alert('投稿に失敗しました: ' + e.message);
    btn.disabled = false;
  });
}

function loadRanking() {
  const list = document.getElementById('rank-list');
  if (!fbReady) {
    list.innerHTML = '<div class="rank-loading">Firebase未設定のためランキングを表示できません</div>';
    return;
  }
  list.innerHTML = '<div class="rank-loading">読み込み中...</div>';
  db.ref('rankings').once('value').then(snap => {
      const items = [];
      snap.forEach(c => {
        const v = c.val();
        if (v && typeof v.score === 'number' && v.name) items.push(v);
      });
      items.sort((a, b) => b.score - a.score || a.ts - b.ts);
      const top20 = items.slice(0, 20);
      if (top20.length === 0) {
        list.innerHTML = '<div class="rank-loading">まだ記録がありません</div>';
        return;
      }
      list.innerHTML = top20.map((item, idx) => {
        const posClass = idx === 0 ? 'gold' : idx === 1 ? 'silver' : idx === 2 ? 'bronze' : '';
        const medal = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : (idx + 1);
        return `<div class="rank-item">
          <div class="rank-pos ${posClass}">${medal}</div>
          <div class="rank-name">${item.name}</div>
          <div class="rank-score">${item.score}<span class="rank-score-unit">問</span></div>
        </div>`;
      }).join('');
    }).catch(e => {
      list.innerHTML = '<div class="rank-loading">読み込みエラー: ' + e.message + '</div>';
    });
}

/* ══════════════ SNS SHARE ══════════════ */

  const text = `駅オタク　クイズアプリで${score}問正解しました！🚃\nhttps://takeda-app.github.io/ekiotaku/\n#駅オタク #地理クイズ #鉄道好きと繋がりたい`;
  const url = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(text);
  window.open(url, '_blank');
}

updateBestDisp();
